<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <!-- Penting untuk kamera HP -->
  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no">

  <title>Kamera BISAMA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .camera-container {
      width: 100%;
      max-width: 600px;
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,.12);
    }

    .title {
      text-align: center;
      margin-bottom: 15px;
    }

    .title h2 {
      margin: 0;
      color: #1565c0;
    }

    .title p {
      margin: 7px 0 0;
      color: #666;
      font-size: 14px;
    }

    .camera-box {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #111;
      border-radius: 14px;
      overflow: hidden;
    }

    video,
    canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    canvas {
      display: none;
    }

    .status {
      margin: 12px 0;
      padding: 10px;
      border-radius: 8px;
      background: #eef5ff;
      color: #145da0;
      font-size: 14px;
      text-align: center;
    }

    .status.error {
      background: #fff0f0;
      color: #c62828;
    }

    .status.success {
      background: #eef9f0;
      color: #2e7d32;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    button {
      flex: 1;
      border: none;
      border-radius: 10px;
      padding: 13px 10px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: .15s;
    }

    button:active {
      transform: scale(.96);
    }

    .btn-camera {
      background: #1565c0;
      color: white;
    }

    .btn-capture {
      background: #2196f3;
      color: white;
    }

    .btn-retake {
      background: #757575;
      color: white;
    }

    .btn-use {
      background: #2e7d32;
      color: white;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .hidden {
      display: none !important;
    }

    .camera-switch {
      margin-top: 10px;
      text-align: center;
    }

    .camera-switch button {
      flex: none;
      width: auto;
      padding: 9px 16px;
      background: #eeeeee;
      color: #333;
    }

    .preview {
      margin-top: 15px;
      border-radius: 12px;
      overflow: hidden;
      display: none;
    }

    .preview img {
      width: 100%;
      display: block;
    }

    @media (max-width: 480px) {
      body {
        padding: 10px;
      }

      .camera-container {
        padding: 14px;
      }

      .buttons {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<div class="camera-container">

  <div class="title">
    <h2>📷 Kamera BISAMA</h2>
    <p>Gunakan kamera untuk mengambil foto presensi</p>
  </div>

  <div id="status" class="status">
    Menyiapkan kamera...
  </div>

  <div class="camera-box">
    <video id="video"
           autoplay
           playsinline
           muted></video>

    <canvas id="canvas"></canvas>
  </div>

  <div class="camera-switch">
    <button id="switchCameraBtn">
      🔄 Ganti Kamera
    </button>
  </div>

  <div class="buttons">

    <button id="startCameraBtn"
            class="btn-camera">
      📷 Aktifkan Kamera
    </button>

    <button id="captureBtn"
            class="btn-capture"
            disabled>
      📸 Ambil Foto
    </button>

  </div>

  <div id="afterCaptureButtons"
       class="buttons hidden">

    <button id="retakeBtn"
            class="btn-retake">
      🔄 Ulangi Foto
    </button>

    <button id="usePhotoBtn"
            class="btn-use">
      ✅ Gunakan Foto
    </button>

  </div>

  <div id="preview"
       class="preview">

    <img id="previewImage"
         alt="Preview foto">

  </div>

</div>

<script>

let stream = null;
let currentFacingMode = "environment";
let capturedPhoto = null;


/* =========================================================
   ELEMENT
========================================================= */

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");

const statusBox = document.getElementById("status");

const startCameraBtn =
  document.getElementById("startCameraBtn");

const captureBtn =
  document.getElementById("captureBtn");

const switchCameraBtn =
  document.getElementById("switchCameraBtn");

const retakeBtn =
  document.getElementById("retakeBtn");

const usePhotoBtn =
  document.getElementById("usePhotoBtn");

const afterCaptureButtons =
  document.getElementById("afterCaptureButtons");

const preview =
  document.getElementById("preview");

const previewImage =
  document.getElementById("previewImage");


/* =========================================================
   STATUS
========================================================= */

function setStatus(message, type = "") {

  statusBox.textContent = message;

  statusBox.className = "status";

  if (type) {
    statusBox.classList.add(type);
  }
}


/* =========================================================
   CEK KAMERA
========================================================= */

function checkCameraSupport() {

  if (!window.isSecureContext) {

    setStatus(
      "Kamera membutuhkan HTTPS. Buka melalui GitHub Pages.",
      "error"
    );

    return false;
  }

  if (!navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia) {

    setStatus(
      "Browser ini tidak mendukung akses kamera.",
      "error"
    );

    return false;
  }

  return true;
}


/* =========================================================
   START CAMERA
========================================================= */

async function startCamera() {

  if (!checkCameraSupport()) {
    return;
  }

  stopCamera();

  setStatus("Meminta izin kamera...");

  try {

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: {
            ideal: currentFacingMode
          },

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }
        },

        audio: false

      });

    video.srcObject = stream;

    await video.play();

    captureBtn.disabled = false;

    startCameraBtn.disabled = true;

    setStatus(
      "Kamera aktif. Silakan ambil foto.",
      "success"
    );

  }

  catch (error) {

    console.error(error);

    let message =
      "Kamera tidak dapat digunakan.";

    if (error.name === "NotAllowedError") {

      message =
        "Izin kamera ditolak. Izinkan kamera pada browser.";

    }

    else if (error.name === "NotFoundError") {

      message =
        "Kamera tidak ditemukan pada perangkat.";

    }

    else if (error.name === "NotReadableError") {

      message =
        "Kamera sedang digunakan aplikasi lain.";

    }

    else if (error.name === "SecurityError") {

      message =
        "Akses kamera diblokir oleh keamanan browser.";

    }

    setStatus(message, "error");

    captureBtn.disabled = true;
    startCameraBtn.disabled = false;
  }
}


/* =========================================================
   STOP CAMERA
========================================================= */

function stopCamera() {

  if (stream) {

    stream.getTracks().forEach(track => {
      track.stop();
    });

    stream = null;
  }

  video.srcObject = null;

  captureBtn.disabled = true;

  startCameraBtn.disabled = false;
}


/* =========================================================
   AMBIL FOTO
========================================================= */

function capturePhoto() {

  if (!stream) {

    setStatus(
      "Kamera belum aktif.",
      "error"
    );

    return;
  }

  const width = video.videoWidth;
  const height = video.videoHeight;

  if (!width || !height) {

    setStatus(
      "Kamera belum siap. Coba lagi.",
      "error"
    );

    return;
  }

  canvas.width = width;
  canvas.height = height;

  const ctx =
    canvas.getContext("2d");

  ctx.drawImage(
    video,
    0,
    0,
    width,
    height
  );

  const base64 =
    canvas.toDataURL(
      "image/jpeg",
      0.85
    );

  capturedPhoto = {
    name: "presensi-live.jpg",
    mimeType: "image/jpeg",
    base64: base64.split(",")[1]
  };

  previewImage.src = base64;

  preview.style.display = "block";

  afterCaptureButtons.classList.remove("hidden");

  captureBtn.disabled = true;

  setStatus(
    "Foto berhasil diambil. Periksa preview sebelum digunakan.",
    "success"
  );

  stopCamera();
}


/* =========================================================
   ULANGI FOTO
========================================================= */

function retakePhoto() {

  capturedPhoto = null;

  preview.style.display = "none";

  afterCaptureButtons.classList.add("hidden");

  startCamera();
}


/* =========================================================
   GUNAKAN FOTO
========================================================= */

function usePhoto() {

  if (!capturedPhoto) {

    setStatus(
      "Belum ada foto yang diambil.",
      "error"
    );

    return;
  }

  /*
   * Mengirim foto ke halaman BISAMA.
   *
   * Parent page akan menerima:
   *
   * {
   *   type: "BISAMA_CAMERA_PHOTO",
   *   photo: {...}
   * }
   */

  const receiverWindow = window.opener || window.parent;
  const targetOrigin = "https://script.google.com";

  receiverWindow.postMessage({
    type: "BISAMA_CAMERA_PHOTO",
    photo: capturedPhoto
  }, targetOrigin);

  setStatus(
    "Foto dikirim ke BISAMA.",
    "success"
  );

  // Jika kamera dibuka sebagai tab/jendela baru, tutup kembali
  // setelah foto berhasil dikirim ke BISAMA.
  if (window.opener && !window.opener.closed) {
    setTimeout(function () {
      window.close();
    }, 500);
  }
}


/* =========================================================
   GANTI KAMERA
========================================================= */

async function switchCamera() {

  if (currentFacingMode === "environment") {

    currentFacingMode = "user";

  } else {

    currentFacingMode = "environment";
  }

  await startCamera();
}


/* =========================================================
   EVENT
========================================================= */

startCameraBtn.addEventListener(
  "click",
  startCamera
);

captureBtn.addEventListener(
  "click",
  capturePhoto
);

retakeBtn.addEventListener(
  "click",
  retakePhoto
);

usePhotoBtn.addEventListener(
  "click",
  usePhoto
);

switchCameraBtn.addEventListener(
  "click",
  switchCamera
);


/* =========================================================
   SAAT HALAMAN DITUTUP
========================================================= */

window.addEventListener(
  "beforeunload",
  stopCamera
);


/* =========================================================
   AUTO CHECK
========================================================= */

checkCameraSupport();

</script>

</body>
</html>
